org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# Heap lowered from the template's -Xmx4G: this VM has 7.7 GB RAM and no swap;
# a 4 GB Gradle daemon + Kotlin daemon gets OOM-killed when other builds run.
# VM quirks (see ~/workspace/lifewave/TOOLCHAIN.md):
# - The -Djava.net.preferIPv4Stack=true above MUST be in the daemon JVM args:
#   without it the daemon uses IPv4-mapped IPv6 sockets, which this VM's
#   egress gateway intercepts/resets, breaking all Maven/Google downloads.
# - org.gradle.java.home below is a fallback: the Lifewave builds use a
#   dedicated GRADLE_USER_HOME (~/workspace/toolchain/gradle-user-home) whose
#   gradle.properties sets java.home to the real JDK 17 binary. The shared
#   ~/.gradle config points it at a wrapper script whose daemon reports a
#   different java.home and fails Gradle's daemon context check.
org.gradle.java.home=/home/hatch/workspace/toolchain/jdk-17.0.20.1+1
android.useAndroidX=true
android.enableJetifier=true
